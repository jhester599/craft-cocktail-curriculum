name: keep supabase awake

# A free-tier Supabase project pauses after 7 days without database activity,
# and a paused project refuses the syncs this site depends on. Pinging every
# three days keeps it awake with plenty of margin.
#
# Note: GitHub disables scheduled workflows in repositories with no activity for
# 60 days. If the repo goes quiet for that long, re-enable this from the Actions
# tab - or the project will pause despite this workflow existing.

on:
  schedule:
    # 09:00 UTC every third day. Longest gap is three days, well under seven.
    - cron: "0 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only, so there is nothing to install. Config comes from
      # supabase.py, which already holds these values in public - see the module
      # docstring for why they are not repository secrets.
      - name: Ping the project
        id: ping
        run: |
          set +e
          python3 keepalive.py
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # A silent failure here is the worst outcome: the project pauses anyway
      # and nobody finds out until a sync fails on someone's phone.
      - name: Report a ping that could not get through
        if: steps.ping.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create supabase \
            --description "Sync backend health" --color 3ECF8E 2>/dev/null || true

          cat > body.md <<'EOF'
          The scheduled keep-alive could not reach the Supabase project.

          If this is not fixed, the project will pause after 7 days without
          database activity, and cross-device sync will fail until it is
          restored from the Supabase dashboard.

          Worth checking, in order:

          - Is the project still active in the Supabase dashboard? Restoring a
            paused project takes about 30 seconds.
          - Has the publishable key been rotated? It lives in `supabase.py`.
          - Does `docs/synccheck.html` on the live site still pass all five
            checks from a browser?
          EOF
          echo "" >> body.md
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> body.md

          existing=$(gh issue list --label supabase --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --label supabase \
              --title "Supabase keep-alive could not reach the project" --body-file body.md
          fi
          exit 1

      - name: Close the issue once the ping gets through again
        if: steps.ping.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label supabase --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The keep-alive reached the project again on $(date -u '+%Y-%m-%d'). Closing automatically."
          fi
