name: build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # jsdom is a dev dependency for the smoke test only. The page itself
      # has no runtime dependencies and no build toolchain.
      - name: Install test dependencies
        run: npm ci

      - name: Build the page
        run: python3 build.py

      # The whole point: docs/index.html is generated, and GitHub Pages serves
      # the committed copy. If someone edits data.py and forgets to rebuild,
      # the site silently ships stale content. Fail here instead.
      - name: Check the committed pages match a fresh build
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error file=docs/index.html::The committed pages under docs/ are stale. Run 'python3 build.py' and commit the result."
            echo
            echo "Diff between the committed page and a fresh build:"
            git --no-pager diff --stat -- docs/
            echo
            git --no-pager diff -- docs/ | head -200
            exit 1
          fi
          echo "docs/ is up to date with the sources."

      - name: Run the tracker smoke test
        run: npm test

      # No network: the checks stub urlopen. This covers the retry-wakes-a-
      # sleeping-project path, which the scheduled run itself cannot assert on.
      - name: Check the Supabase keep-alive
        run: python3 keepalive.test.py
