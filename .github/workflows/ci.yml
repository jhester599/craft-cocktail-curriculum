name: build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # jsdom is a dev dependency for the smoke test only. The page itself
      # has no runtime dependencies and no build toolchain.
      - name: Install test dependencies
        run: npm ci

      - name: Build the page
        run: python3 build.py

      # The whole point: docs/index.html is generated, and GitHub Pages serves
      # the committed copy. If someone edits data.py and forgets to rebuild,
      # the site silently ships stale content. Fail here instead.
      - name: Check the committed page matches a fresh build
        run: |
          if ! git diff --quiet -- docs/index.html; then
            echo "::error file=docs/index.html::docs/index.html is stale. Run 'python3 build.py' and commit the result."
            echo
            echo "Diff between the committed page and a fresh build:"
            git --no-pager diff --stat -- docs/index.html
            echo
            git --no-pager diff -- docs/index.html | head -200
            exit 1
          fi
          echo "docs/index.html is up to date with data.py, tracker.py and build.py."

      - name: Run the tracker smoke test
        run: npm test
